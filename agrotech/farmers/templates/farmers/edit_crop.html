{% extends 'base.html' %}
{% load static %}
{% block title %}Edit Crop – AgroTech{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'farmers/edit_crop.css' %}?v=6" />
{% endblock %}

{% block content %}
<div class="page-wrapper narrow">
  <div class="page-header">
    <h2>Edit Crop: {{ crop.name }}</h2>
    <a href="{% url 'farmers:my_crops' %}" class="btn btn-outline-sm">← Back</a>
  </div>

  <div class="form-card">
    <form method="POST" enctype="multipart/form-data" class="main-form">
      {% csrf_token %}

      <div class="form-row two-col">
        <div class="form-group">
          <label>Crop / Product Name</label>
          <input type="text" name="name" value="{{ form.instance.name }}" required />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select name="category">
            {% for val, label in form.fields.category.choices %}
              <option value="{{ val }}" {% if form.instance.category == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="4">{{ form.instance.description }}</textarea>
      </div>

      <div class="form-row two-col">
        <div class="form-group">
          <label>Price per kg (₹)</label>
          <input type="number" name="price_per_kg" step="0.01" value="{{ form.instance.price_per_kg }}" required />
        </div>
        <div class="form-group">
          <label>Available Quantity (kg)</label>
          <input type="number" name="quantity_kg" step="0.1" value="{{ form.instance.quantity_kg }}" required />
        </div>
      </div>

      <div class="form-group">
        <label>Location</label>
        <input type="text" name="location" value="{{ form.instance.location }}" required />
      </div>

      <div class="form-group">
        <label>Update Crop Image</label>
        {% if form.instance.image %}
          <div class="current-photo">
            <img src="{{ form.instance.image.url }}" alt="Current" style="width:80px;height:80px;object-fit:cover;border-radius:8px;" />
            <span>Current image</span>
          </div>
        {% endif %}
        <input type="file" name="image" accept="image/*" />
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" name="is_available" {% if form.instance.is_available %}checked{% endif %} />
          Mark as available for sale
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-green">Save Changes</button>
        <a href="{% url 'farmers:my_crops' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
