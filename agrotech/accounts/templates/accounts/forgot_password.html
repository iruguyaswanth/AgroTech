{% extends 'base.html' %}
{% load static %}
{% block title %}Forgot Password – AgroTech{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'accounts/forgot_password.css' %}" />
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <h2>Forgot Password</h2>
      <p>Enter your email and we'll send a reset link.</p>
    </div>

    <form method="POST" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="Your registered email" required />
      </div>
      <button type="submit" class="btn btn-green btn-full">Send Reset Link</button>
    </form>

    <div class="auth-footer">
      <a href="{% url 'accounts:login' %}">← Back to Login</a>
    </div>

  </div>
</div>
{% endblock %}
